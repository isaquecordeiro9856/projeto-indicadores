<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Debug - TASY Analytics</title>
<link rel="stylesheet" href="css/common.css">
<style>pre{background:#f1f5f9;padding:12px;border-radius:6px;overflow:auto;font-size:12px}</style>
</head>
<body style="padding:24px">
<h2>Debug - Teste de API</h2>
<p>Este teste faz login e chama todos os endpoints diretamente (sem Angular).</p>
<div id="out">Carregando...</div>
<script>
const out=document.getElementById('out');
function log(m){ out.innerHTML += m+'<br>'; console.log(m); }
async function run(){
  try{
    log('1) Login isaque/dhfxop90 ...');
    let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nm_usuario:'isaque',ds_senha:'dhfxop90'})});
    let j=await r.json();
    if(!j.token) throw new Error('login falhou: '+JSON.stringify(j));
    const token=j.token;
    log('   OK token '+token.slice(0,20)+'... perfil='+JSON.stringify(j.perfil.dashboards));
    localStorage.setItem('tasy_token',token);
    localStorage.setItem('tasy_usuario',JSON.stringify(j.usuario));
    localStorage.setItem('tasy_perfil',JSON.stringify(j.perfil));

    const tests=[
      {path:'/api/etapa',body:{dimensao:'convenio',indicador:'todos',tipoPeriodo:'mes',periodoValor:'2026-08-01',ordem:'desc',limite:5},name:'etapa convenio (enfermagem)'},
      {path:'/api/glosas',body:{dimensao:'convenio',indicador:'todos',tipoPeriodo:'mes',periodoValor:'2026-08-01',ordem:'desc',limite:5},name:'glosas convenio (financeiro)'},
      {path:'/api/pempfrg',body:{dimensao:'convenio',indicador:'todos',tipoPeriodo:'mes',periodoValor:'2026-08-01',ordem:'desc',limite:5},name:'pempfrg convenio (medico)'},
      {path:'/api/farmacia',body:{dimensao:'material',indicador:'todos',tipoPeriodo:'mes',periodoValor:'2026-08-01',ordem:'desc',limite:5},name:'farmacia material'},
      {path:'/api/centrocirurgico',body:{dimensao:'procedimento',indicador:'todos',tipoPeriodo:'mes',periodoValor:'2026-08-01',ordem:'desc',limite:5},name:'centrocirurgico procedimento'},
      {path:'/api/fisioterapia',body:{dimensao:'procedimento',indicador:'todos',tipoPeriodo:'mes',periodoValor:'2026-08-01',ordem:'desc',limite:5},name:'fisioterapia procedimento'},
    ];
    for(const t of tests){
      log('<br><b>'+t.name+'</b> POST '+t.path+' ...');
      let rr=await fetch(t.path,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(t.body)});
      let jj=await rr.json();
      if(rr.ok && jj.dados){
        log('   OK status '+rr.status+' dados='+jj.dados.length+' dim='+jj.nomeDimensao);
        log('<pre>'+JSON.stringify(jj.dados[0],null,2).substring(0,800)+'</pre>');
      } else {
        log('   ERRO status '+rr.status+' '+JSON.stringify(jj).substring(0,800));
      }
    }
    log('<br><b>Teste concluído. Se tudo deu OK, a API está funcionando. Problema é no Angular/Chart no navegador.</b>');
    log('<br>Agora vá para <a href="login.html">login.html</a> e faça login. Se o hub não mostrar 6 cards, faça Logout e login novamente (perfil antigo em cache).');
  } catch(e){
    log('<span style="color:red">ERRO: '+e.message+'</span>');
  }
}
run();
</script>
</body>
</html>
